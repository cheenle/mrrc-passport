name: Build firmware

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-

      # Compile-and-verify only: this job exists to prove the tag (or the manual
      # run) still builds and still passes tools/verify_firmware.py.  It does not
      # publish an image.  A CI-built image cannot carry this terminal's Wi-Fi
      # and server credentials, which live in the gitignored
      # sdkconfig.defaults.local, so it would boot and never reach the radio.
      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Source-only releases: the tag is a version marker, not a firmware drop.
      # A CI-built image cannot be configured for a specific terminal anyway —
      # Wi-Fi and server credentials live in the gitignored
      # sdkconfig.defaults.local (see doc-conventions.md), so what CI produces
      # would boot, log "no SSID configured" and never reach the radio.  Build
      # yourself with your own credentials; GitHub attaches the source archives
      # to this release automatically.
      # The release title is the annotated tag's subject, not the bare tag name:
      # `git tag -a v1.4.0 -m "Mobile Link v1.4.0"` produces a release called
      # "Mobile Link v1.4.0".  This replaces a manual rename after every release
      # (docs/development/release/project-completion.md) with something the tag
      # itself carries — the title and the version then cannot disagree, and no
      # API token is needed to fix one.  A lightweight tag keeps the tag name.
      - name: Read the release title from the tag
        id: title
        run: |
          subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${{ github.ref_name }}")"
          if [ -z "$subject" ]; then
            subject="${{ github.ref_name }}"
          fi
          printf 'value=%s\n' "$subject" >> "$GITHUB_OUTPUT"
          echo "release title: $subject"

      - name: Create release (tag push, source only)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ steps.title.outputs.value }}"
          body: >
            Source-only release. No prebuilt firmware is attached: a CI image
            cannot carry this terminal's Wi-Fi and server credentials, which are
            kept out of the repository. Build it yourself from this tag — see
            docs/development/engineering/environment-setup.md, and put your own
            settings in sdkconfig.defaults.local.
