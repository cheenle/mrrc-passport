name: Release title

# Why this exists: a release title is a product name plus the version, and the
# version already lives in the tag. The convention used to be "rename it in the
# web UI after the release" (docs/development/release/project-completion.md) —
# which is exactly the kind of manual step that gets skipped, and cannot be done
# at all from a machine that has push access but no API token.
#
# So: the title is data in the repository. Edit .github/release-title.json and
# push; this workflow applies it with the runner's own GITHUB_TOKEN. Idempotent —
# re-running with the same values changes nothing.

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-title.json"
      - ".github/workflows/release-title.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-title
  cancel-in-progress: false

jobs:
  retitle:
    name: Apply release title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read the wanted title
        id: want
        run: |
          tag="$(python3 -c 'import json;print(json.load(open(".github/release-title.json"))["tag"])')"
          title="$(python3 -c 'import json;print(json.load(open(".github/release-title.json"))["title"])')"
          if [ -z "$tag" ] || [ -z "$title" ]; then
            echo "::error file=.github/release-title.json::tag and title are both required"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Apply
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.want.outputs.tag }}"
          title="${{ steps.want.outputs.title }}"
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          auth="Authorization: Bearer $TOKEN"
          accept="Accept: application/vnd.github+json"

          if [ -z "$TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty — check the workflow permissions block"
            exit 1
          fi

          # Read the current title. Print the body on failure instead of a bare
          # exit code: without a token on the maintainer's machine this log is
          # the only diagnostics anyone gets.
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "$auth" -H "$accept" "$api")"
          if [ "$code" != "200" ]; then
            echo "::error::GET $api -> HTTP $code"
            cat "$body"
            exit 1
          fi
          current="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("name") or "")' "$body")"

          if [ "$current" = "$title" ]; then
            echo "already \"$title\" — nothing to do"
            exit 0
          fi

          patch="$(mktemp)"
          code="$(curl -sS -o "$patch" -w '%{http_code}' -X PATCH \
            -H "$auth" -H "$accept" \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"name": sys.argv[1]}))' "$title")" \
            "$api")"
          if [ "$code" != "200" ]; then
            echo "::error::PATCH $api -> HTTP $code"
            cat "$patch"
            echo "If this is 403, the repository's workflow permissions are read-only:"
            echo "Settings -> Actions -> General -> Workflow permissions -> Read and write."
            exit 1
          fi
          echo "renamed \"$current\" -> \"$title\" ($tag)"
